[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antibot-detect"
version = "0.1.0"
description = "Passively fingerprint which anti-bot / bot-management solution a website uses (detection only, no bypass)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "antibot-detect contributors" }]
keywords = [
    "anti-bot",
    "bot-management",
    "fingerprinting",
    "security",
    "waf",
    "cloudflare",
    "akamai",
    "datadome",
    "detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "curl_cffi>=0.6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
antibot-detect = "antibot_detect.cli:main"

[project.urls]
Homepage = "https://github.com/mmewni/antibot-detect"
Repository = "https://github.com/mmewni/antibot-detect"
Issues = "https://github.com/mmewni/antibot-detect/issues"

[tool.setuptools.packages.find]
include = ["antibot_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
